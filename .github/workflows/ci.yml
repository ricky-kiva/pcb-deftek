name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore pcb-deftek.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build pcb-deftek.slnx -c Release --no-restore -warnaserror

      - name: Unit tests
        run: >
          dotnet test tests/pcb-deftek.Tests/pcb-deftek.Tests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName!~DirectMlInferenceTests"
          --logger "trx;LogFileName=unit.trx"
          --results-directory artifacts/test-results
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: BDD tests
        run: >
          dotnet test tests/pcb-deftek.Bdd/pcb-deftek.Bdd.csproj
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=bdd.trx"
          --results-directory artifacts/test-results
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn
